name: Build / Publish AAC Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release after validation
        required: true
        type: boolean
        default: false
      draft:
        description: Publish as a draft release
        required: true
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .github/release-request.json

permissions:
  contents: write

concurrency:
  group: adaptive-auto-connector-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and verify release
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
              throw 'AAC releases must be built from the main branch.'
          }

      - name: Check out exact release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release request
        id: request
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath './mods-unpacked/guardipee14-AdaptiveAutoConnector/manifest.json' -Raw | ConvertFrom-Json
          $version = [string]$manifest.version_number

          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              $publish = '${{ inputs.publish }}' -eq 'true'
              $draft = '${{ inputs.draft }}' -eq 'true'
              $prerelease = '${{ inputs.prerelease }}' -eq 'true'
          }
          else {
              $request = Get-Content -LiteralPath './.github/release-request.json' -Raw | ConvertFrom-Json

              if ([string]$request.version -ne $version) {
                  throw "Release request version '$($request.version)' does not match manifest version '$version'."
              }

              $publish = [bool]$request.publish
              $draft = [bool]$request.draft
              $prerelease = [bool]$request.prerelease
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "draft=$($draft.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build, verify, and optionally publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseParameters = @{}

          if ('${{ steps.request.outputs.publish }}' -eq 'true') {
              $releaseParameters.Publish = $true
          }

          if ('${{ steps.request.outputs.draft }}' -eq 'true') {
              $releaseParameters.Draft = $true
          }

          if ('${{ steps.request.outputs.prerelease }}' -eq 'true') {
              $releaseParameters.Prerelease = $true
          }

          ./tools/New-Release.ps1 @releaseParameters

      - name: Verify requested GitHub Release
        id: published_release
        if: steps.request.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.request.outputs.version }}'
          $tag = "v$version"
          $archiveName = "guardipee14-AdaptiveAutoConnector-v$version.zip"
          $checksumName = "$archiveName.sha256"

          $releaseJson = & gh release view $tag --repo '${{ github.repository }}' --json tagName,url,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) {
              throw "Requested GitHub Release $tag does not exist."
          }

          $release = $releaseJson | ConvertFrom-Json
          if ([string]$release.tagName -ne $tag) {
              throw "Release tag verification failed. Expected $tag, got '$($release.tagName)'."
          }

          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          if ($archiveName -notin $assetNames) {
              throw "GitHub Release $tag is missing ZIP asset $archiveName."
          }

          if ($checksumName -notin $assetNames) {
              throw "GitHub Release $tag is missing checksum asset $checksumName."
          }

          "release_url=$($release.url)" >> $env:GITHUB_OUTPUT
          Write-Host "Verified GitHub Release: $($release.url)"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v6
        with:
          name: adaptive-auto-connector-release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.zip
            release/*.sha256
            release/*-release-notes.md

      - name: Write release summary
        shell: pwsh
        run: |
          $version = '${{ steps.request.outputs.version }}'
          $archive = "guardipee14-AdaptiveAutoConnector-v$version.zip"
          $checksum = Get-Content -LiteralPath "./release/$archive.sha256" -Raw
          $releaseUrl = '${{ steps.published_release.outputs.release_url }}'

          @"
          ## Adaptive Auto Connector v$version

          - Source commit: ``${{ github.sha }}``
          - Trigger: ``${{ github.event_name }}``
          - Publish requested: ``${{ steps.request.outputs.publish }}``
          - Prerelease: ``${{ steps.request.outputs.prerelease }}``
          - Archive: ``$archive``
          - SHA-256: ``$($checksum.Split(' ')[0].Trim())``
          - Release URL: ``$releaseUrl``
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
